<section class="page-section" id="page-jadwal">
  <header class="page-header">
    <h2 class="page-title">Jadwal</h2>
    <p class="page-subtitle">Jadwal kuliah mingguan</p>
  </header>

  <div class="kpi-grid">
    <article class="kpi-card"><span class="kpi-label">Total Sesi</span><span class="kpi-value" data-total>0</span></article>
    <article class="kpi-card"><span class="kpi-label">Hari Aktif</span><span class="kpi-value" data-days>0</span></article>
  </div>

  <div class="card">
    <header class="card-header">
      <div>
        <h3 class="card-title">Jadwal Mingguan</h3>
        <p class="card-meta">Disusun ulang per hari, dari jam paling pagi</p>
      </div>
      <button class="button" type="button" data-open data-crud-bar>+ Tambah Jadwal</button>
    </header>
    <div class="card-body">
      <div data-list></div>
    </div>
  </div>

  <div class="fm-overlay" data-overlay hidden></div>

  <section class="fm-sheet" data-sheet role="dialog" aria-modal="true" aria-labelledby="jadwal-title" hidden>
    <header class="fm-sheet-head">
      <h3 class="fm-sheet-title" id="jadwal-title" data-sheet-title>Tambah Jadwal</h3>
      <button class="icon-btn" type="button" data-close aria-label="Tutup">✕</button>
    </header>
    <div class="fm-sheet-body">
      <form class="form" data-form novalidate>
        <div class="form-field">
          <label class="label" for="jadwal-day">Hari</label>
          <select class="select" id="jadwal-day" name="day">
            <option value="">Pilih hari</option>
            <option value="Senin">Senin</option>
            <option value="Selasa">Selasa</option>
            <option value="Rabu">Rabu</option>
            <option value="Kamis">Kamis</option>
            <option value="Jumat">Jumat</option>
            <option value="Sabtu">Sabtu</option>
            <option value="Minggu">Minggu</option>
          </select>
        </div>
        <div class="grid two">
          <div class="form-field">
            <label class="label" for="jadwal-start">Jam mulai</label>
            <input class="input" id="jadwal-start" name="start" type="time" step="300">
          </div>
          <div class="form-field">
            <label class="label" for="jadwal-end">Jam selesai</label>
            <input class="input" id="jadwal-end" name="end" type="time" step="300">
          </div>
        </div>
        <div class="form-field">
          <label class="label" for="jadwal-course">Mata Kuliah</label>
          <input class="input" id="jadwal-course" name="course" type="text" autocomplete="off" placeholder="Contoh: Pemrograman Web">
        </div>
        <div class="grid two">
          <div class="form-field">
            <label class="label" for="jadwal-room">Ruang</label>
            <input class="input" id="jadwal-room" name="room" type="text" autocomplete="off">
          </div>
          <div class="form-field">
            <label class="label" for="jadwal-lecturer">Pengajar</label>
            <input class="input" id="jadwal-lecturer" name="lecturer" type="text" autocomplete="off">
          </div>
        </div>
        <p class="form-error" data-error role="alert"></p>
      </form>
    </div>
    <footer class="fm-sheet-foot">
      <button class="button button--ghost" type="button" data-cancel>Batal</button>
      <button class="button" type="button" data-save>Simpan</button>
    </footer>
  </section>

  <div class="toast" data-toast role="status" aria-live="polite"></div>
</section>
