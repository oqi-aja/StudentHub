<section class="page-section profil">
  <header class="page-header">
    <h2 class="page-title">Profil</h2>
    <p class="page-subtitle">Informasi akun kamu</p>
  </header>

  <div class="card">
    <header class="card-header">
      <div>
        <h3 class="card-title" data-user-name>-</h3>
        <p class="card-meta" data-user-username>-</p>
      </div>
      <span class="badge badge--info" data-role-value>-</span>
    </header>
    <div class="card-body">
      <div class="info-row">
        <span class="fm-kv-key">Sesi</span>
        <span class="fm-kv-val">Mockup lokal</span>
      </div>
      <div class="info-row">
        <span class="fm-kv-key">Akun</span>
        <span class="fm-kv-val" data-account-state>-</span>
      </div>
      <p class="card-meta">Akun ini dipakai untuk melihat dan mengelola data tugas milikmu secara terpisah.</p>
    </div>
    <footer class="card-footer">
      <button class="button" type="button" data-logout>Logout</button>
    </footer>
  </div>
</section>
